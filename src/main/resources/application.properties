kiwoom.api.base-url=https://api.kiwoom.com
kiwoom.api.key=${KIWOOM_APP_KEY}
kiwoom.api.secret=${KIWOOM_SECRET_KEY}
kiwoom.api.connect-timeout=${KIWOOM_CONNECT_TIMEOUT:3s}
kiwoom.api.response-timeout=${KIWOOM_RESPONSE_TIMEOUT:10s}
kiwoom.api.max-connections=${KIWOOM_MAX_CONNECTIONS:20}
kiwoom.api.max-retries=${KIWOOM_MAX_RETRIES:2}
kiwoom.api.retry-backoff=${KIWOOM_RETRY_BACKOFF:200ms}
kiwoom.api.current-price-cache-ttl=${KIWOOM_CURRENT_PRICE_CACHE_TTL:3s}
kiwoom.api.daily-price-cache-ttl=${KIWOOM_DAILY_PRICE_CACHE_TTL:10m}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
app.security.username=${APP_USERNAME:admin}
app.security.password=${APP_PASSWORD:change-me}
app.security.login-success-url=/
app.alert.scheduler.enabled=${ALERT_SCHEDULER_ENABLED:false}
app.alert.scheduler.username=${ALERT_SCHEDULER_USERNAME:${APP_USERNAME:admin}}
app.alert.scheduler.cron=${ALERT_SCHEDULER_CRON:0 */5 9-15 * * MON-FRI}
app.market.holidays=${MARKET_HOLIDAYS:}
app.market-data.scheduler.enabled=${MARKET_DATA_SCHEDULER_ENABLED:false}
app.market-data.scheduler.batch-size=${MARKET_DATA_SYNC_BATCH_SIZE:100}
app.market-data.scheduler.cron=${MARKET_DATA_SYNC_CRON:0 10 16 * * MON-FRI}
app.trading.mode=${TRADING_MODE:SIGNAL_ONLY}
app.trading.live-enabled=${LIVE_TRADING_ENABLED:false}
app.trading.live-confirmation=${LIVE_TRADING_CONFIRMATION:}
app.trading.paper-initial-cash=${PAPER_INITIAL_CASH:10000000}
app.trading.max-position-rate=${TRADING_MAX_POSITION_RATE:0.10}
app.trading.max-gross-exposure-rate=${TRADING_MAX_GROSS_EXPOSURE_RATE:0.50}
app.trading.max-daily-loss-rate=${TRADING_MAX_DAILY_LOSS_RATE:0.02}
app.trading.max-drawdown-rate=${TRADING_MAX_DRAWDOWN_RATE:0.10}
app.trading.max-open-positions=${TRADING_MAX_OPEN_POSITIONS:5}
app.trading.scheduler.enabled=${TRADING_SCHEDULER_ENABLED:false}
app.trading.scheduler.batch-size=${TRADING_SCHEDULER_BATCH_SIZE:100}
app.trading.scheduler.cron=${TRADING_SCHEDULER_CRON:0 5 9 * * MON-FRI}
app.trading.swing-monitor.enabled=${SWING_MONITOR_ENABLED:false}
app.trading.swing-monitor.cron=${SWING_MONITOR_CRON:0 */1 9-15 * * MON-FRI}
app.trading.swing-monitor.close-cron=${SWING_CLOSE_CRON:0 35 15 * * MON-FRI}
server.reactive.session.cookie.same-site=strict
server.reactive.session.cookie.http-only=true
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=kiwoom
info.app.description=Kiwoom stock price service
spring.r2dbc.url=${DATABASE_R2DBC_URL:r2dbc:postgresql://localhost:5432/kiwoom}
spring.r2dbc.username=${DATABASE_USERNAME:kiwoom}
spring.r2dbc.password=${POSTGRES_PASSWORD:local-password}
spring.datasource.url=${DATABASE_JDBC_URL:jdbc:postgresql://localhost:5432/kiwoom}
spring.datasource.username=${DATABASE_USERNAME:kiwoom}
spring.datasource.password=${POSTGRES_PASSWORD:local-password}
spring.flyway.enabled=true
