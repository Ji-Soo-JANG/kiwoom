kiwoom.api.base-url=https://api.kiwoom.com
kiwoom.api.key=${KIWOOM_APP_KEY}
kiwoom.api.secret=${KIWOOM_SECRET_KEY}
kiwoom.api.connect-timeout=${KIWOOM_CONNECT_TIMEOUT:3s}
kiwoom.api.response-timeout=${KIWOOM_RESPONSE_TIMEOUT:10s}
kiwoom.api.max-connections=${KIWOOM_MAX_CONNECTIONS:20}
kiwoom.api.max-retries=${KIWOOM_MAX_RETRIES:2}
kiwoom.api.retry-backoff=${KIWOOM_RETRY_BACKOFF:200ms}
kiwoom.api.current-price-cache-ttl=${KIWOOM_CURRENT_PRICE_CACHE_TTL:3s}
kiwoom.api.daily-price-cache-ttl=${KIWOOM_DAILY_PRICE_CACHE_TTL:10m}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
app.security.username=${APP_USERNAME:admin}
app.security.password=${APP_PASSWORD:change-me}
server.reactive.session.cookie.same-site=strict
server.reactive.session.cookie.http-only=true
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=kiwoom
info.app.description=Kiwoom stock price service
spring.r2dbc.url=${DATABASE_R2DBC_URL:r2dbc:postgresql://localhost:5432/kiwoom}
spring.r2dbc.username=${DATABASE_USERNAME:kiwoom}
spring.r2dbc.password=${POSTGRES_PASSWORD:local-password}
spring.datasource.url=${DATABASE_JDBC_URL:jdbc:postgresql://localhost:5432/kiwoom}
spring.datasource.username=${DATABASE_USERNAME:kiwoom}
spring.datasource.password=${POSTGRES_PASSWORD:local-password}
spring.flyway.enabled=true
