name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Resolve backend coverage base
        id: coverage-base
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            base_sha="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
          else
            base_sha="${{ github.event.before }}"
            if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
              echo "BASE_UNAVAILABLE: invalid push predecessor" >&2
              exit 1
            fi
          fi
          git rev-parse --verify "$base_sha^{commit}"
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Run backend quality contract
        run: bash scripts/quality.sh backend --base "${{ steps.coverage-base.outputs.sha }}"
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run frontend quality contract
        run: bash scripts/quality.sh frontend
      - name: Upload Vitest coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: frontend/coverage
