services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: kiwoom
      POSTGRES_USER: kiwoom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-password}
    ports:
      - "5432:5432"
    volumes:
      - kiwoom-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiwoom -d kiwoom"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kiwoom-postgres:
